<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nikshmi | Site em Manutenção</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="./img/taro-icon.png">

    <!-- Estilo Principal -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .manutencao-container {
            text-align: center;
        }

        .manutencao-container img {
            max-width: 280px;
            width: 80%;
            margin-bottom: 30px;
        }

        .manutencao-container p {
            color: #f9f7f7;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .manutencao-container p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="manutencao-container">
        <img src="./img/Nikshmi.logo.png" alt="Logo Nikshmi">
        <p>Site em manutenção</p>
    </div>

</body>
</html>
